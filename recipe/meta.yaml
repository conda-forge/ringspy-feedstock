{% set name = "ringspy" %}
{% set version = "1.2.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: d1d797ff2e2681d705157a7c8e0d44380c8b2549bcbcf9ef1c3e26268084f400

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - python >=3.7
    - setuptools
    - wheel
    - requests >=2
    - numpy
    - scipy
    - matplotlib-base >=3.2.2
    - hexalattice ==1.2.1
    - vtk

test:
  imports:
    - ringspy
  requires:
    - pip

  commands:
    - pip check

about:
  home: https://github.com/kingyin3613/ringspy
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: LICENSE
  summary: "A geometric generation tool for prismatic cellular solids"
  doc_url: https://github.com/kingyin3613/ringspy/wiki
  dev_url: https://github.com/kingyin3613/ringspy

extra:
  recipe-maintainers:
    - kingyin3613
