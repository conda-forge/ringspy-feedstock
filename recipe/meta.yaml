{% set name = "ringspy" %}
{% set version = "2.1.0" %}
{% set python_min = "3.10" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 04faaefecae0f5e1305313cd38ee65a15a911ade40202baa6f900b4c10d45366

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - ringspy = ringspy.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - matplotlib-base >=3.2.2
    - tomli >=1.1  # used on Python 3.10 only
    # optional on PyPI (extras [vtk] and [hex]), included here as in earlier conda packages
    - vtk-base
    - hexalattice >=1.2.1

test:
  imports:
    - ringspy
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - ringspy --help

about:
  home: https://github.com/kingyin3613/ringspy
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: "A geometric generation tool for prismatic cellular solids"
  doc_url: https://github.com/kingyin3613/ringspy
  dev_url: https://github.com/kingyin3613/ringspy

extra:
  recipe-maintainers:
    - kingyin3613
